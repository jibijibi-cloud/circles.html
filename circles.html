<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Geometry Assessment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .question {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .question p {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }
        .options {
            margin-left: 20px;
        }
        .options label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .options label:hover {
            background-color: #e0e0e0;
        }
        .options input[type="radio"] {
            margin-right: 10px;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
        .incorrect {
            color: red;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .question {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Circle Geometry Quiz</h1>
        <div id="quiz">
            <div class="question">
                <p>1. What is the formula for the area of a circle?</p>
                <div class="options">
                    <label><input type="radio" name="q1" value="a"> πr²</label>
                    <label><input type="radio" name="q1" value="b"> 2πr</label>
                    <label><input type="radio" name="q1" value="c"> πd</label>
                </div>
                <div class="feedback" id="feedback1"></div>
            </div>
            <div class="question">
                <p>2. If the radius is 5 cm, what is the circumference?</p>
                <div class="options">
                    <label><input type="radio" name="q2" value="a"> 10π cm</label>
                    <label><input type="radio" name="q2" value="b"> 25π cm</label>
                    <label><input type="radio" name="q2" value="c"> 5π cm</label>
                </div>
                <div class="feedback" id="feedback2"></div>
            </div>
            <div class="question">
                <p>3. What is the diameter if the radius is 3 units?</p>
                <div class="options">
                    <label><input type="radio" name="q3" value="a"> 3 units</label>
                    <label><input type="radio" name="q3" value="b"> 6 units</label>
                    <label><input type="radio" name="q3" value="c"> 9 units</label>
                </div>
                <div class="feedback" id="feedback3"></div>
            </div>
            <div class="question">
                <p>4. A circle has an area of 49π cm². What is the radius?</p>
                <div class="options">
                    <label><input type="radio" name="q4" value="a"> 7 cm</label>
                    <label><input type="radio" name="q4" value="b"> 14 cm</label>
                    <label><input type="radio" name="q4" value="c"> 49 cm</label>
                </div>
                <div class="feedback" id="feedback4"></div>
            </div>
            <div class="question">
                <p>5. What is the relationship between radius (r) and diameter (d)?</p>
                <div class="options">
                    <label><input type="radio" name="q5" value="a"> d = 2r</label>
                    <label><input type="radio" name="q5" value="b"> d = r/2</label>
                    <label><input type="radio" name="q5" value="c"> d = πr</label>
                </div>
                <div class="feedback" id="feedback5"></div>
            </div>
        </div>
        <button onclick="submitQuiz()">Submit Quiz</button>
        <div id="result"></div>
    </div>

    <script>
        const answers = { q1: 'a', q2: 'a', q3: 'b', q4: 'a', q5: 'a' };
        const feedbacks = {
            q1: { 
                a: 'Correct! Area = πr².', 
                b: 'Incorrect. That\'s circumference. The correct answer is πr².', 
                c: 'Incorrect. The correct answer is πr².' 
            },
            q2: { 
                a: 'Correct! Circumference = 2πr.', 
                b: 'Incorrect. That\'s area. The correct answer is 10π cm.', 
                c: 'Incorrect. The correct answer is 10π cm.' 
            },
            q3: { 
                a: 'Incorrect. Diameter is twice the radius. The correct answer is 6 units.', 
                b: 'Correct! d = 2r.', 
                c: 'Incorrect. The correct answer is 6 units.' 
            },
            q4: { 
                a: 'Correct! r = √(area/π).', 
                b: 'Incorrect. That\'s diameter. The correct answer is 7 cm.', 
                c: 'Incorrect. The correct answer is 7 cm.' 
            },
            q5: { 
                a: 'Correct! Diameter is twice the radius.', 
                b: 'Incorrect. It\'s the opposite. The correct answer is d = 2r.', 
                c: 'Incorrect. No π involved. The correct answer is d = 2r.' 
            }
        };

        function submitQuiz() {
            let score = 0;
            for (let i = 1; i <= 5; i++) {
                const selected = document.querySelector(`input[name=q${i}]:checked`);
                const feedbackDiv = document.getElementById(`feedback${i}`);
                if (selected) {
                    const value = selected.value;
                    feedbackDiv.textContent = feedbacks[`q${i}`][value];
                    feedbackDiv.className = value === answers[`q${i}`] ? 'feedback' : 'feedback incorrect';
                    if (value === answers[`q${i}`]) score++;
                } else {
                    feedbackDiv.textContent = 'Please select an answer.';
                    feedbackDiv.className = 'feedback incorrect';
                }
            }
            document.getElementById('result').textContent = `Your score: ${score}/5`;
        }
    </script>
</body>
</html>
